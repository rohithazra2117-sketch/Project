<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Gallery | Hello, World!</title>
    <style>
      :root { color-scheme: dark; } * { box-sizing: border-box; }
      body { min-height: 100vh; margin: 0; padding: 20px; font-family: Inter, ui-sans-serif, system-ui, sans-serif; color: #f7f8ff; background: radial-gradient(circle at 12% 15%, #5340a8 0, transparent 35%), radial-gradient(circle at 88% 85%, #087e9e 0, transparent 38%), #090b1a; }
      main { width: min(1060px, 100%); margin: auto; padding: clamp(1.8rem, 5vw, 3.5rem); border: 1px solid rgba(255,255,255,.16); border-radius: 28px; background: rgba(19,23,51,.7); box-shadow: 0 28px 80px rgba(0,0,0,.35); backdrop-filter: blur(18px); }
      nav { display: flex; flex-wrap: wrap; justify-content: center; gap: .4rem; margin-bottom: 3rem; } nav a { padding: .48rem .8rem; border-radius: 999px; color: #cdd2ef; text-decoration: none; font-size: .88rem; } nav a:hover, nav a[aria-current="page"] { color: #fff; background: rgba(255,255,255,.12); }
      .label { margin: 0 0 .7rem; color: #8feaff; font-size: .78rem; font-weight: 750; letter-spacing: .14em; text-transform: uppercase; } h1 { margin: 0; font-size: clamp(2.8rem, 7vw, 5.2rem); letter-spacing: -.065em; line-height: .95; } .intro { margin: 1rem 0 2.4rem; color: #cdd2ef; line-height: 1.7; }
      .grid { display: grid; grid-template-columns: repeat(12, 1fr); grid-auto-rows: 118px; gap: 14px; } .tile { position: relative; overflow: hidden; border: 1px solid rgba(255,255,255,.16); border-radius: 18px; isolation: isolate; transition: transform .25s ease, border-color .25s ease; } .tile:hover { transform: translateY(-5px); border-color: rgba(255,255,255,.42); } .tile::before { content: ""; position: absolute; inset: 0; background: var(--art); transition: transform .35s ease; } .tile:hover::before { transform: scale(1.08); } .tile::after { content: attr(data-title); position: absolute; right: 0; bottom: 0; left: 0; padding: 2.5rem 1rem 1rem; font-weight: 700; background: linear-gradient(transparent, rgba(7,9,25,.82)); } .a { grid-column: span 7; grid-row: span 3; --art: linear-gradient(135deg, #b48cff, #6d42e7 45%, #1c164c); } .b { grid-column: span 5; grid-row: span 2; --art: radial-gradient(circle at 70% 30%, #caff77 0 8%, transparent 9%), linear-gradient(135deg, #0c7f7d, #18315d); } .c { grid-column: span 5; --art: linear-gradient(120deg, #fa9b53, #ec4b7a, #55236e); } .d { grid-column: span 4; grid-row: span 2; --art: radial-gradient(circle at 30% 30%, #9beaff, transparent 28%), linear-gradient(145deg, #256197, #151833); } .e { grid-column: span 4; grid-row: span 2; --art: linear-gradient(145deg, #f8db82, #d56d70 52%, #351945); } .f { grid-column: span 4; grid-row: span 2; --art: radial-gradient(circle at 70% 30%, #fff, transparent 5%), linear-gradient(135deg, #5364d8, #152350); } @media (max-width: 650px) { .grid { grid-template-columns: repeat(2, 1fr); grid-auto-rows: 145px; } .tile, .a, .b, .c, .d, .e, .f { grid-column: span 1; grid-row: span 1; } .a { grid-column: span 2; } }
    </style>
  </head>
  <body>
    <main>
      <nav aria-label="Main navigation"><a href="index.html">Home</a><a href="about.html">About</a><a href="gallery.html" aria-current="page">Gallery</a><a href="contact.html">Contact</a></nav>
      <p class="label">Selected moments</p>
      <h1>Colour, shape, spark.</h1>
      <p class="intro">A small collection of abstract studies in light and colour.</p>
      <section class="grid" aria-label="Abstract art gallery">
        <article class="tile a" data-title="Violet Horizon"></article><article class="tile b" data-title="Lime Light"></article><article class="tile c" data-title="Warm Current"></article><article class="tile d" data-title="Blue Echo"></article><article class="tile e" data-title="Golden Hour"></article><article class="tile f" data-title="Night Signal"></article>
      </section>
    </main>
  </body>
</html>
