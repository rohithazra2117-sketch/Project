<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Contact | Hello, World!</title>
    <style>
      :root { color-scheme: dark; } * { box-sizing: border-box; }
      body { min-height: 100vh; margin: 0; display: grid; place-items: center; padding: 20px; font-family: Inter, ui-sans-serif, system-ui, sans-serif; color: #f7f8ff; background: radial-gradient(circle at 12% 15%, #5340a8 0, transparent 35%), radial-gradient(circle at 88% 85%, #087e9e 0, transparent 38%), #090b1a; }
      main { width: min(680px, 100%); padding: clamp(2.2rem, 7vw, 4.5rem); border: 1px solid rgba(255,255,255,.16); border-radius: 28px; background: rgba(19,23,51,.7); box-shadow: 0 28px 80px rgba(0,0,0,.35); backdrop-filter: blur(18px); }
      nav { display: flex; justify-content: center; gap: .4rem; margin-bottom: 3.2rem; } nav a { padding: .48rem .8rem; border-radius: 999px; color: #cdd2ef; text-decoration: none; font-size: .88rem; } nav a:hover, nav a[aria-current="page"] { color: #fff; background: rgba(255,255,255,.12); }
      .label { margin: 0 0 .8rem; color: #8feaff; font-size: .78rem; font-weight: 750; letter-spacing: .14em; text-transform: uppercase; } h1 { margin: 0 0 2rem; font-size: clamp(2.8rem, 8vw, 5rem); letter-spacing: -.065em; line-height: .95; } form { display: grid; gap: 1rem; } label { color: #cdd2ef; font-size: .9rem; } input, textarea { width: 100%; margin-top: .42rem; padding: .85rem 1rem; border: 1px solid rgba(255,255,255,.15); border-radius: 12px; outline: none; color: #fff; font: inherit; background: rgba(255,255,255,.07); } input:focus, textarea:focus { border-color: #89e9ff; box-shadow: 0 0 0 3px rgba(137,233,255,.15); } textarea { min-height: 110px; resize: vertical; } button { justify-self: start; padding: .85rem 1.2rem; border: 0; border-radius: 999px; cursor: pointer; color: #10132a; font: inherit; font-weight: 750; background: linear-gradient(100deg, #9eeaff, #c2b2ff); }
    </style>
  </head>
  <body>
    <main>
      <nav aria-label="Main navigation"><a href="index.html">Home</a><a href="about.html">About</a><a href="contact.html" aria-current="page">Contact</a></nav>
      <p class="label">Get in touch</p>
      <h1>Let’s say hello.</h1>
      <form onsubmit="event.preventDefault(); this.querySelector('button').textContent = 'Message sent — thank you!';">
        <label>Your name<input name="name" type="text" placeholder="Ada Lovelace" required /></label>
        <label>Email address<input name="email" type="email" placeholder="ada@example.com" required /></label>
        <label>Your message<textarea name="message" placeholder="What’s on your mind?" required></textarea></label>
        <button type="submit">Send message</button>
      </form>
    </main>
  </body>
</html>
