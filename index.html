<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="A stylish Hello World page." />
    <title>Hello, World!</title>
    <style>
      :root { color-scheme: dark; }
      * { box-sizing: border-box; }
      body {
        min-height: 100vh;
        margin: 0;
        display: grid;
        place-items: center;
        overflow: hidden;
        font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
        color: #f7f8ff;
        background: #090b1a;
      }
      body::before, body::after {
        content: "";
        position: fixed;
        width: 44vmax;
        height: 44vmax;
        border-radius: 50%;
        filter: blur(36px);
        opacity: .42;
        z-index: -1;
        animation: float 12s ease-in-out infinite alternate;
      }
      body::before { background: #6d4aff; top: -18vmax; left: -10vmax; }
      body::after { background: #00c8ff; bottom: -22vmax; right: -12vmax; animation-delay: -5s; }
      main {
        width: min(680px, calc(100% - 40px));
        padding: clamp(2.5rem, 8vw, 5rem);
        text-align: center;
        background: rgba(19, 23, 51, .64);
        border: 1px solid rgba(255, 255, 255, .16);
        border-radius: 28px;
        box-shadow: 0 28px 80px rgba(0, 0, 0, .38), inset 0 1px rgba(255, 255, 255, .12);
        backdrop-filter: blur(18px);
        animation: appear .8s cubic-bezier(.2, .8, .2, 1) both;
      }
      nav { display: flex; justify-content: center; gap: .4rem; margin-bottom: 3.4rem; }
      nav a { padding: .48rem .8rem; border-radius: 999px; color: #cdd2ef; text-decoration: none; font-size: .88rem; transition: background .2s ease, color .2s ease; }
      nav a:hover, nav a[aria-current="page"] { color: #fff; background: rgba(255,255,255,.12); }
      .eyebrow {
        display: inline-flex;
        align-items: center;
        gap: .55rem;
        margin: 0 0 1.2rem;
        font-size: .78rem;
        font-weight: 700;
        letter-spacing: .13em;
        text-transform: uppercase;
        color: #b9c9ff;
      }
      .dot { width: .6rem; height: .6rem; border-radius: 50%; background: #52f0a8; box-shadow: 0 0 16px #52f0a8; }
      h1 {
        margin: 0;
        font-size: clamp(3.3rem, 10vw, 6.8rem);
        line-height: .95;
        letter-spacing: -.07em;
        background: linear-gradient(125deg, #ffffff 20%, #b8c7ff 52%, #75e7ff);
        -webkit-background-clip: text;
        background-clip: text;
        color: transparent;
      }
      p { max-width: 31rem; margin: 1.5rem auto 0; font-size: clamp(1rem, 2vw, 1.16rem); line-height: 1.7; color: #cdd2ef; }
      button {
        margin-top: 2rem;
        padding: .9rem 1.25rem;
        border: 0;
        border-radius: 999px;
        cursor: pointer;
        color: #10132a;
        font: inherit;
        font-weight: 750;
        background: linear-gradient(100deg, #9eeaff, #c2b2ff);
        box-shadow: 0 12px 28px rgba(76, 153, 255, .27);
        transition: transform .2s ease, box-shadow .2s ease;
      }
      button:hover { transform: translateY(-3px); box-shadow: 0 18px 34px rgba(76, 153, 255, .38); }
      @keyframes appear { from { opacity: 0; transform: translateY(22px) scale(.98); } to { opacity: 1; transform: none; } }
      @keyframes float { to { transform: translate(12vmax, 8vmax) scale(1.12); } }
      @media (prefers-reduced-motion: reduce) { *, *::before, *::after { animation-duration: .01ms !important; transition-duration: .01ms !important; } }
    </style>
  </head>
  <body>
    <main>
      <nav aria-label="Main navigation">
        <a href="index.html" aria-current="page">Home</a>
        <a href="about.html">About</a>
        <a href="gallery.html">Gallery</a>
        <a href="contact.html">Contact</a>
      </nav>
      <div class="eyebrow"><span class="dot"></span> Your new beginning</div>
      <h1>Hello, World!</h1>
      <p>A tiny greeting, dressed for a grand entrance. Your next idea starts right here.</p>
      <button type="button" id="hello-button">Say hello back</button>
    </main>
    <script>
      const button = document.querySelector('#hello-button');
      button.addEventListener('click', () => {
        button.textContent = 'Hello to you too! ✨';
      });
    </script>
  </body>
</html>
